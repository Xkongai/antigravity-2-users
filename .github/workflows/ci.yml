name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -S style install.sh uninstall.sh scripts/*.sh
  macos-syntax:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n and --help
        run: |
          for f in install.sh uninstall.sh scripts/*.sh; do bash -n "$f"; done
          ./install.sh --help
          ./uninstall.sh --help
          ./install.sh --version
